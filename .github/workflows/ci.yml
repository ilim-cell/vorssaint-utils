name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Swift 6 Compatibility & Tests
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Build Artifacts & Objects
        uses: actions/cache@v4
        with:
          path: |
            build/objects
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-build-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift', 'build.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Unit tests
        run: ./build.sh --test

  build:
    name: Build & Package (macOS 27 Preview)
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Build Artifacts & Objects
        uses: actions/cache@v4
        with:
          path: |
            build/objects
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-build-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift', 'build.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build & Stage
        run: ./build.sh

      - name: Package DMG
        run: ./Tools/make-dmg.sh
